name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck get-kira.sh scripts/*.sh

  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze get-kira.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path get-kira.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  sh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: dash
          - os: ubuntu-latest
            shell: bash --posix
          - os: macos-latest
            shell: sh
          - os: macos-latest
            shell: zsh --emulate sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dry run
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: ${{ matrix.shell }} ./get-kira.sh --dry-run --name CI --gender unspecified --language auto --no-co-author
      - name: End-to-end tests
        run: sh scripts/test.sh '${{ matrix.shell }}'

  powershell:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Dry run
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}\claude
        run: ./get-kira.ps1 -DryRun -Name CI -Gender unspecified -Language auto -NoCoAuthor
      - name: Install, rerun, uninstall
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}\claude
        run: |
          ./get-kira.ps1 -Name CI -Gender female -Language French -CoAuthor 'Kira <kira@example.com>'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $styles = Join-Path $env:CLAUDE_CONFIG_DIR 'output-styles'
          if (-not (Test-Path (Join-Path $styles 'kira-cozy.md'))) { throw 'styles not installed' }
          $settings = Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json') -Raw
          if (-not $settings.Contains('"outputStyle": "Kira (cozy)"')) { throw 'outputStyle not set' }
          if (-not $settings.Contains('"attribution": {"commit": "", "pr": ""}')) { throw 'attribution not set' }
          $rerun = ./get-kira.ps1 *>&1 | Out-String
          if ($rerun -match 'kirakit: (copy|link|backup|set|save)') { throw "rerun changed files:`n$rerun" }
          ./get-kira.ps1 -Uninstall
          if (Test-Path (Join-Path $styles 'kira-cozy.md')) { throw 'uninstall left styles' }

  parity:
    # get-kira.ps1 reimplements the build: its output must match build.sh byte for byte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install with both installers
        run: |
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh" sh get-kira.sh --copy --name Alex --gender female \
            --language French --co-author 'Kira <kira@example.com>'
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps" pwsh -File get-kira.ps1 -Copy -Name Alex -Gender female \
            -Language French -CoAuthor 'Kira <kira@example.com>'
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh-assistant" sh get-kira.sh --copy --name Alex --gender male \
            --language auto --assistant 'Kira <kira@example.com>' --assistant-github kira-bot --no-co-author
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-assistant" pwsh -File get-kira.ps1 -Copy -Name Alex -Gender male \
            -Language auto -Assistant 'Kira <kira@example.com>' -AssistantGithub kira-bot -NoCoAuthor
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh-analyst" sh get-kira.sh --copy --name Alex --gender female \
            --language auto --assistant 'Kira <kira@example.com>' --analyst-github iris-bot
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-analyst" pwsh -File get-kira.ps1 -Copy -Name Alex -Gender female \
            -Language auto -Assistant 'Kira <kira@example.com>' -AnalystGithub iris-bot
          grep -qx 'analyst=yes' "$RUNNER_TEMP/ps-analyst/.kirakit-profile"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh-generic" sh get-kira.sh --copy </dev/null
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-generic" pwsh -File get-kira.ps1 -Copy </dev/null
      - name: Same release tag picked without a clone
        run: |
          remote=$RUNNER_TEMP/remote
          git init -q -b main "$remote"
          cp -r personas team scripts claude github get-kira.sh get-kira.ps1 "$remote/"
          git -C "$remote" add -A
          git -C "$remote" -c user.name=ci -c user.email=ci@example.com commit -q -m ci
          for tag in v0.9.0 v0.10.0 v0.2.1; do git -C "$remote" tag "$tag"; done
          export KIRAKIT_REPO="file://$remote" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ref"
          profile='-Name A -Gender male -Language auto -NoCoAuthor'
          sh -s -- --dry-run --name A --gender male --language auto --no-co-author <get-kira.sh |
            grep -F '(v0.10.0)'
          pwsh -Command "& ([scriptblock]::Create((Get-Content -Raw ./get-kira.ps1))) -DryRun $profile" |
            grep -F '(v0.10.0)'
      - name: Compare
        run: |
          for pair in sh:ps sh-assistant:ps-assistant sh-analyst:ps-analyst sh-generic:ps-generic; do
            a=$RUNNER_TEMP/${pair%%:*} b=$RUNNER_TEMP/${pair##*:}
            for path in output-styles skills rules CLAUDE.md settings.json; do
              diff -r "$a/$path" "$b/$path"
            done
            # Agents exist only for some profiles (IRIS with an analyst); both or neither.
            if [ -e "$a/agents" ] || [ -e "$b/agents" ]; then diff -r "$a/agents" "$b/agents"; fi
            diff "$a/.kirakit-profile" "$b/.kirakit-profile" || [ ! -e "$a/.kirakit-profile" ]
          done
          test -f "$RUNNER_TEMP/ps-analyst/agents/iris.md"
          test -f "$RUNNER_TEMP/ps-analyst/output-styles/iris.md"
      - name: Optional files
        # A template wholly inside a block that is dropped is neither built nor installed, and
        # is removed when an earlier run installed it, by both installers.
        run: |
          src=$RUNNER_TEMP/optional-src
          cp -r . "$src"
          printf '%s\n' '{{#assistant_github}}' '---' 'name: optional' '---' '' \
            'For {{assistant_github}}.' '{{/assistant_github}}' >"$src/claude/agents/optional.md"
          install() {
            if [ "$1" = sh ]; then
              CLAUDE_CONFIG_DIR="$2" sh "$src/get-kira.sh" --copy --name Alex --gender male \
                --language auto --assistant 'Kira <kira@example.com>' --assistant-github "$3" </dev/null
            else
              CLAUDE_CONFIG_DIR="$2" pwsh -File "$src/get-kira.ps1" -Copy -Name Alex -Gender male \
                -Language auto -Assistant 'Kira <kira@example.com>' -AssistantGithub "$3" </dev/null
            fi
          }
          for tool in sh ps; do
            dir=$RUNNER_TEMP/optional-$tool
            install "$tool" "$dir" kira-bot >/dev/null
            grep -qF 'For kira-bot.' "$dir/agents/optional.md"
            install "$tool" "$dir" '' >/dev/null
            if [ -e "$dir/agents/optional.md" ]; then echo "::error::$tool kept optional.md"; exit 1; fi
            if grep -q optional.md "$dir/.kirakit-manifest"; then echo "::error::$tool lists optional.md"; exit 1; fi
          done
          for path in output-styles skills rules CLAUDE.md agents; do
            diff -r "$RUNNER_TEMP/optional-sh/$path" "$RUNNER_TEMP/optional-ps/$path"
          done
